<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" fill="none" aria-hidden="true" focusable="false">
  <!-- Phong cảnh 3 lớp Xưởng quà trong ngôi làng mùa đông đã lên đèn ấm sáng (#FFF8E9) -->
  <defs>
    <linearGradient id="warmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBF0D9" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F3E3C3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="warmHillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F5EAD6"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE38E" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#D9A63A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D9A63A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#warmSky)"/>

  <!-- LỚP 1 (XA): Rừng thông và bóng núi tuyết ấm -->
  <path d="M0 295 Q 290 220, 610 272 T 1150 248 T 1440 280 L 1440 420 L 0 420 Z" fill="#D5E4DC" opacity="0.6"/>
  <g fill="#6B9A84" opacity="0.45">
    <polygon points="70,210 44,288 96,288"/>
    <polygon points="112,188 80,288 144,288"/>
    <polygon points="1240,198 1212,282 1268,282"/>
    <polygon points="1290,178 1255,282 1325,282"/>
  </g>

  <!-- LỚP 2 (TRUNG CẢNH): Ngôi làng mùa đông lên đèn ấm áp bên sườn đồi -->
  <path d="M0 328 C 320 278, 650 352, 990 306 C 1200 282, 1335 308, 1440 296 L 1440 420 L 0 420 Z" fill="url(#warmHillMid)"/>

  <!-- Xưởng quà / Cửa hàng nhỏ bên phải với cửa sổ vàng ấm -->
  <g transform="translate(1145, 232)">
    <circle cx="44" cy="42" r="46" fill="url(#windowGlow)"/>
    <rect x="12" y="26" width="64" height="42" rx="3" fill="#8C583A"/>
    <path d="M4 28 L44 3 L84 28 Z" fill="#CF3D2D"/>
    <path d="M6 27 L44 5 L82 27" stroke="#FFFDF7" stroke-width="5" stroke-linecap="round"/>
    <!-- Ống khói nhỏ -->
    <rect x="58" y="6" width="10" height="16" fill="#6E4229"/>
    <ellipse cx="63" cy="6" rx="6" ry="2.5" fill="#FFFDF7"/>
    <!-- Cửa sổ lên đèn vàng ấm -->
    <rect x="22" y="36" width="16" height="16" rx="2" fill="#FFE596" stroke="#5C3722" stroke-width="1.5"/>
    <rect x="46" y="36" width="16" height="16" rx="2" fill="#FFE596" stroke="#5C3722" stroke-width="1.5"/>
    <line x1="30" y1="36" x2="30" y2="52" stroke="#8C583A" stroke-width="1.2"/>
    <line x1="54" y1="36" x2="54" y2="52" stroke="#8C583A" stroke-width="1.2"/>
  </g>

  <!-- Nhà gỗ nhỏ bên trái -->
  <g transform="translate(165, 248)">
    <circle cx="32" cy="30" r="34" fill="url(#windowGlow)"/>
    <rect x="8" y="20" width="48" height="32" rx="2" fill="#9E6B49"/>
    <path d="M2 22 L32 3 L62 22 Z" fill="#137B4F"/>
    <path d="M4 21 L32 5 L60 21" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
    <rect x="18" y="28" width="12" height="12" rx="1.5" fill="#FFE596"/>
    <rect x="34" y="28" width="12" height="12" rx="1.5" fill="#FFE596"/>
  </g>

  <!-- Cụm thông xanh phủ tuyết và đèn vàng -->
  <g fill="#137B4F">
    <polygon points="48,225 14,340 82,340"/>
    <polygon points="48,195 20,285 76,285"/>
    <polygon points="104,248 76,345 132,345"/>
    <polygon points="1365,215 1328,338 1402,338"/>
    <polygon points="1365,182 1336,276 1394,276"/>
  </g>
  <g fill="#D9A63A">
    <circle cx="42" cy="255" r="3"/>
    <circle cx="56" cy="278" r="3"/>
    <circle cx="36" cy="302" r="3"/>
    <circle cx="1358" cy="242" r="3.2"/>
    <circle cx="1374" cy="268" r="3.2"/>
    <circle cx="1352" cy="295" r="3.2"/>
  </g>

  <!-- Đường mòn & Hàng rào gỗ -->
  <path d="M580 420 C 625 375, 705 348, 760 318 C 800 348, 860 380, 920 420 Z" fill="#F6EBD4" opacity="0.8"/>
  <g stroke="#9C7A54" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
    <line x1="1040" y1="322" x2="1040" y2="348"/>
    <line x1="1070" y1="325" x2="1070" y2="351"/>
    <line x1="1100" y1="328" x2="1100" y2="354"/>
    <line x1="1032" y1="331" x2="1108" y2="338"/>
    <line x1="1032" y1="341" x2="1108" y2="348"/>
  </g>

  <!-- LỚP 3 (GẦN): Triền tuyết trắng kem tiền cảnh -->
  <path d="M0 374 Q 380 344, 760 380 T 1440 364 L 1440 420 L 0 420 Z" fill="#FFFDF7"/>
</svg>
