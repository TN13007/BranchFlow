<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyStore" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9EC"/>
      <stop offset="55%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#EDF6F2"/>
    </linearGradient>
    <linearGradient id="snowMid" x1="800" y1="540" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF5F0"/>
      <stop offset="100%" stop-color="#DCECE4"/>
    </linearGradient>
    <linearGradient id="snowFront" x1="800" y1="680" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#E6F2EC"/>
    </linearGradient>
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBA8"/>
      <stop offset="100%" stop-color="#D9A63A"/>
    </radialGradient>
  </defs>

  <!-- Calm Vanilla-Snow Sky for high table readability -->
  <rect width="1600" height="900" fill="url(#skyStore)"/>

  <!-- Distant misty pine forest silhouettes -->
  <path d="M0 640 C160 600, 320 620, 480 650 C680 680, 920 630, 1180 610 C1360 595, 1490 615, 1600 630 L1600 900 L0 900 Z" fill="#D5E8DF" fill-opacity="0.65"/>

  <!-- Left distant layered pines -->
  <g opacity="0.85">
    <path d="M90 430 C60 480, 48 515, 72 520 C48 560, 36 595, 68 602 C40 640, 32 675, 148 675 C148 675, 140 640, 112 602 C144 595, 132 560, 108 520 C132 515, 120 480, 90 430 Z" fill="#8AB8A3" stroke="#5E8F79" stroke-width="3" stroke-linejoin="round"/>
    <path d="M90 430 C72 460, 68 475, 90 478 C112 475, 108 460, 90 430 Z" fill="#FFFDF7"/>
    <path d="M185 485 C162 525, 154 550, 172 555 C152 588, 144 615, 226 615 C226 615, 218 588, 198 555 C216 550, 208 525, 185 485 Z" fill="#9EC5B3" stroke="#6B9B86" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Middle ground rolling snowbanks -->
  <path d="M0 675 C280 635, 560 685, 860 665 C1140 645, 1380 615, 1600 645 L1600 900 L0 900 Z" fill="url(#snowMid)" stroke="#BFD8CC" stroke-width="2.5"/>

  <!-- Right side: Cute Cartoon Village Timber Storehouse -->
  <g transform="translate(1140, 420)">
    <!-- Pine behind storehouse -->
    <path d="M310 -30 C275 30, 260 65, 290 72 C260 120, 248 160, 372 160 C372 160, 360 120, 330 72 C360 65, 345 30, 310 -30 Z" fill="#2A7B58" stroke="#163F2D" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M310 -30 C288 8, 282 28, 310 32 C338 28, 332 8, 310 -30 Z" fill="#FFFDF7"/>

    <!-- Main wooden storehouse body -->
    <rect x="30" y="95" width="250" height="165" rx="14" fill="#9E683C" stroke="#3F2411" stroke-width="4"/>
    <!-- Horizontal timber plank lines -->
    <path d="M34 135 H276 M34 175 H276 M34 215 H276" stroke="#7A4D28" stroke-width="2.5"/>

    <!-- Rounded snow-covered storehouse roof -->
    <path d="M8 108 C8 68, 85 18, 155 18 C225 18, 302 68, 302 108 C284 116, 262 104, 240 110 C215 116, 185 104, 155 110 C125 116, 95 104, 70 110 C45 116, 22 112, 8 108 Z" fill="#FFFDF7" stroke="#6E9483" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M22 102 C65 44, 125 32, 155 32 C185 32, 245 44, 288 102" stroke="#DCECE4" stroke-width="6" stroke-linecap="round"/>

    <!-- Double arched barn doors -->
    <rect x="72" y="138" width="96" height="122" rx="12" fill="#7C4B27" stroke="#3F2411" stroke-width="3.5"/>
    <path d="M120 138 V260 M76 165 L116 254 M164 165 L124 254" stroke="#593317" stroke-width="3" stroke-linecap="round"/>
    <!-- Wreath on storehouse door -->
    <circle cx="120" cy="168" r="16" fill="#198255" stroke="#0D3826" stroke-width="2.5"/>
    <circle cx="120" cy="168" r="6" fill="#7C4B27"/>
    <circle cx="120" cy="153" r="4" fill="#CF3D2D"/>

    <!-- Warm glowing storehouse window -->
    <rect x="194" y="142" width="58" height="58" rx="10" fill="url(#winGlow)" stroke="#3F2411" stroke-width="3.5"/>
    <path d="M223 142 V200 M194 171 H252" stroke="#593317" stroke-width="3"/>
    <rect x="188" y="196" width="70" height="12" rx="6" fill="#FFFDF7" stroke="#8AB09F" stroke-width="2"/>
  </g>

  <!-- Cute wooden fence & blank rounded wooden crates along lower left & right edges -->
  <g transform="translate(80, 650)">
    <!-- Short rounded wooden fence -->
    <path d="M0 40 H150 M0 68 H150" stroke="#8C5830" stroke-width="7" stroke-linecap="round"/>
    <rect x="12" y="20" width="18" height="68" rx="7" fill="#A96E40" stroke="#4A2B13" stroke-width="3"/>
    <rect x="66" y="20" width="18" height="68" rx="7" fill="#A96E40" stroke="#4A2B13" stroke-width="3"/>
    <rect x="120" y="20" width="18" height="68" rx="7" fill="#A96E40" stroke="#4A2B13" stroke-width="3"/>

    <!-- Plain rounded wooden crates (NO text or stencils) -->
    <rect x="175" y="34" width="68" height="64" rx="10" fill="#C88B52" stroke="#4A2B13" stroke-width="3.5"/>
    <rect x="183" y="42" width="52" height="48" rx="6" fill="#B57942" stroke="#6B411E" stroke-width="2"/>
    <path d="M185 44 L233 88 M233 44 L185 88" stroke="#8C5830" stroke-width="3" stroke-linecap="round"/>
    <path d="M172 34 C188 26, 224 26, 246 34 C242 42, 180 42, 172 34 Z" fill="#FFFDF7" stroke="#9AB8AA" stroke-width="2"/>

    <rect x="252" y="50" width="54" height="50" rx="9" fill="#D49A62" stroke="#4A2B13" stroke-width="3.2"/>
    <path d="M252 66 H306 M252 82 H306" stroke="#8C5830" stroke-width="2.5"/>
  </g>

  <!-- Foreground soft snowbanks -->
  <path d="M0 755 C310 715, 620 785, 980 740 C1240 710, 1440 735, 1600 720 L1600 900 L0 900 Z" fill="url(#snowFront)" stroke="#C4DFD3" stroke-width="2.5"/>

  <!-- Subtle footprints in the snow -->
  <ellipse cx="980" cy="790" rx="12" ry="6" fill="#D2E6DC"/>
  <ellipse cx="1025" cy="778" rx="12" ry="6" fill="#D2E6DC"/>
  <ellipse cx="1070" cy="765" rx="11" ry="5.5" fill="#D2E6DC"/>
</svg>
