<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" fill="none" aria-hidden="true" focusable="false">
  <!-- Phong cảnh 3 lớp buổi sáng mùa đông lạnh sáng (#EDF6F2 -> #FFFDF7) dùng cho trạng thái trước đăng nhập -->
  <defs>
    <linearGradient id="coolSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF6F2" stop-opacity="0"/>
      <stop offset="45%" stop-color="#E4F1EC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D7EAE2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="distantPineCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BBDB0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7EA697" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="midHillCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6FBF8"/>
      <stop offset="100%" stop-color="#E2EFEA"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#coolSky)"/>

  <!-- LỚP 1 (XA): Dãy đồi tuyết và bóng rừng thông trong sương sớm -->
  <path d="M0 290 Q 240 215, 520 265 T 1060 245 T 1440 275 L 1440 420 L 0 420 Z" fill="url(#distantPineCool)"/>
  <g fill="#7FA596" opacity="0.55">
    <polygon points="85,205 60,275 110,275"/>
    <polygon points="120,185 90,275 150,275"/>
    <polygon points="158,210 135,275 181,275"/>
    <polygon points="1260,195 1230,275 1290,275"/>
    <polygon points="1305,175 1270,275 1340,275"/>
    <polygon points="1350,205 1322,275 1378,275"/>
  </g>

  <!-- Ngôi nhà nhỏ ở xa bên sườn đồi (đèn buổi sáng còn dịu) -->
  <g transform="translate(210, 218)" opacity="0.78">
    <rect x="8" y="22" width="46" height="32" rx="2" fill="#D5E4DD"/>
    <path d="M2 24 L31 4 L60 24 Z" fill="#5D8375"/>
    <path d="M4 23 L31 6 L58 23" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
    <rect x="20" y="31" width="10" height="10" rx="1.5" fill="#F2DFAF"/>
    <rect x="34" y="31" width="10" height="10" rx="1.5" fill="#F2DFAF"/>
  </g>

  <!-- LỚP 2 (TRUNG CẢNH): Đồi tuyết, đường mòn và hàng rào gỗ -->
  <path d="M0 325 C 310 275, 620 350, 960 305 C 1180 280, 1320 310, 1440 295 L 1440 420 L 0 420 Z" fill="url(#midHillCool)"/>
  <!-- Đường mòn tuyết -->
  <path d="M620 420 C 650 375, 720 350, 770 322 C 805 352, 855 382, 910 420 Z" fill="#EDF6F2" opacity="0.85"/>

  <!-- Rừng thông trung cảnh hai bên -->
  <g fill="#2C6B52">
    <polygon points="42,235 10,335 74,335"/>
    <polygon points="42,205 16,285 68,285"/>
    <polygon points="96,250 70,340 122,340"/>
    <polygon points="1385,225 1350,335 1420,335"/>
    <polygon points="1385,195 1356,282 1414,282"/>
  </g>
  <!-- Tuyết đọng trên tán thông -->
  <path d="M42 205 L26 248 L58 248 Z M1385 195 L1368 240 L1402 240 Z" fill="#FFFDF7" opacity="0.75"/>

  <!-- Hàng rào gỗ mùa đông -->
  <g stroke="#8CA49A" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
    <line x1="145" y1="336" x2="145" y2="362"/>
    <line x1="175" y1="338" x2="175" y2="364"/>
    <line x1="205" y1="340" x2="205" y2="366"/>
    <line x1="138" y1="345" x2="212" y2="349"/>
    <line x1="138" y1="355" x2="212" y2="359"/>
  </g>

  <!-- LỚP 3 (GẦN): Đồi tuyết tiền cảnh sáng trong -->
  <path d="M0 372 Q 360 342, 740 378 T 1440 362 L 1440 420 L 0 420 Z" fill="#FFFDF7"/>
</svg>
