<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" fill="none" aria-hidden="true" focusable="false">
  <!-- Dải cành thông, dây đèn vàng ấm, quả châu và kẹo móc pastel -->
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE89E" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#D9A63A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D9A63A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dây đèn mảnh -->
  <path d="M0 10 Q 80 34, 160 14 T 320 18" stroke="#D9A63A" stroke-width="1.4" stroke-opacity="0.65" fill="none"/>
  <!-- Cành thông lớp sau -->
  <path d="M-8 0 C 24 18, 56 22, 92 8 C 122 24, 164 22, 198 6 C 232 22, 274 20, 328 4 L 328 0 L -8 0 Z" fill="#0D4A30" opacity="0.85"/>
  <!-- Cành thông lớp trước + tuyết đọng -->
  <path d="M0 0 Q 28 22, 62 12 Q 98 26, 136 10 Q 174 24, 214 11 Q 254 25, 292 10 Q 308 16, 320 8 L 320 0 Z" fill="#137B4F"/>
  <path d="M12 4 Q 34 14, 56 7 M 96 5 Q 118 15, 138 7 M 182 5 Q 204 14, 224 7 M 260 4 Q 282 13, 302 6" stroke="#FFFDF7" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  <!-- Quả châu đỏ Noel & vàng champagne -->
  <line x1="62" y1="12" x2="62" y2="28" stroke="#D9A63A" stroke-width="1.2"/>
  <circle cx="62" cy="33" r="6" fill="#CF3D2D"/>
  <circle cx="60" cy="31" r="1.8" fill="#FFFDF7" opacity="0.75"/>
  <!-- Kẹo móc trắng–hồng pastel điểm nhấn -->
  <g transform="translate(154, 12) rotate(12)">
    <path d="M4 22 V7 A4.5 4.5 0 0 1 13 7 V10" stroke="#FFFDF7" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M4 22 V7 A4.5 4.5 0 0 1 13 7 V10" stroke="#E57A93" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="3.2 3.2"/>
  </g>
  <!-- Quả châu vàng ấm -->
  <line x1="248" y1="12" x2="248" y2="25" stroke="#D9A63A" stroke-width="1.2"/>
  <circle cx="248" cy="30" r="5.5" fill="#D9A63A"/>
  <circle cx="246.5" cy="28.5" r="1.6" fill="#FFFDF7" opacity="0.8"/>
  <!-- Bóng đèn ấm tĩnh -->
  <circle cx="34" cy="21" r="10" fill="url(#bulbGlow)"/>
  <circle cx="34" cy="21" r="3.2" fill="#FFFDF7"/>
  <circle cx="112" cy="22" r="10" fill="url(#bulbGlow)"/>
  <circle cx="112" cy="22" r="3.2" fill="#FFFDF7"/>
  <circle cx="204" cy="19" r="10" fill="url(#bulbGlow)"/>
  <circle cx="204" cy="19" r="3.2" fill="#FFFDF7"/>
  <circle cx="288" cy="21" r="10" fill="url(#bulbGlow)"/>
  <circle cx="288" cy="21" r="3.2" fill="#FFFDF7"/>
</svg>
